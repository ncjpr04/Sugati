<template>
    <div class="composer">
        <div class="rail">
            <div class="rail-ey">Channel</div>
            <div class="rail-ch-badge email-badge">
                <div class="rcb-pip"></div>
                <div>
                    <div class="rcb-name">Email</div>
                    <div class="rcb-sub">Postmark · tracked</div>
                </div>
            </div>
            <div class="rail-div"></div>
            <div class="rail-ey">Progress</div>
            <div class="rail-step rs-done"><div class="step-n">✓</div><span class="step-label">Audience</span></div>
            <div class="rail-step rs-done"><div class="step-n">✓</div><span class="step-label">Recipients</span></div>
            <div class="rail-step rs-on"><div class="step-n">3</div><span class="step-label">Compose</span></div>
            <div class="rail-step"><div class="step-n">4</div><span class="step-label">Preview</span></div>
            <div class="rail-step"><div class="step-n">5</div><span class="step-label">Send</span></div>
            <div class="rail-div"></div>
            <div class="rail-ey">Sending to</div>
            <div class="rail-recs">
                <template for:each={railRecipients} for:item="rec">
                    <div key={rec.id} class="rail-rec">
                        <div class="rav">{rec.initials}</div>
                        <div class="rail-rec-body">
                            <div class="rname">{rec.name}</div>
                            <div class="rrole">{rec.role}</div>
                        </div>
                    </div>
                </template>
            </div>
            <div class="rail-div"></div>
            <div class="rail-ey rail-ey-spaced">Template</div>
            <div class="rail-tmpl-box">
                <div class="rail-tmpl-label">Active</div>
                <div class="rail-tmpl-name">{activeTemplateName}</div>
                <div class="rail-tmpl-meta">{activeTemplateMeta}</div>
            </div>
        </div>

        <div class="compose-c">
            <div class="ch-accent-bar"></div>
            <div class="addr-block">
                <div class="addr-row">
                    <div class="addr-key">From</div>
                    <div class="addr-val">
                        <lightning-combobox
                            variant="label-hidden"
                            value={fromComboboxValue}
                            options={fromOptions}
                            onchange={handleFromChange}
                        ></lightning-combobox>
                    </div>
                </div>
                <div class="addr-row">
                    <div class="addr-key">To</div>
                    <div class="addr-val">
                        <template for:each={toChips} for:item="chip">
                            <div key={chip.id} class="r-chip">
                                <div class="r-chip-av">{chip.initials}</div>
                                {chip.name} ({chip.email})
                                <span class="r-chip-x" data-email={chip.email} onclick={handleRemoveChip}>×</span>
                            </div>
                        </template>
                        <div class="r-add-wrap" data-field="to" onclick={stopAddrWrapPropagation}>
                            <div class="r-add" data-field="to" onclick={handleOpenAddrDropdown}>＋ Add</div>
                            <div class={toDropdownClass}>
                                <input
                                    class="addr-search"
                                    type="text"
                                    data-field="to"
                                    placeholder="Name or email…"
                                    value={addrSearchTerm}
                                    oninput={handleAddrSearch}
                                    onkeydown={handleAddrSearchKey}
                                    onclick={stopAddrWrapPropagation}
                                />
                                <div class="addr-dd-list">
                                    <template for:each={toAddrDropdownEntries} for:item="entry">
                                        <template lwc:if={entry.isEmpty}>
                                            <div key={entry.key} class="addr-dd-empty">No matches found</div>
                                        </template>
                                        <template lwc:elseif={entry.isGroupHeader}>
                                            <div key={entry.key} class={entry.headerClass}>
                                                <span class="addr-dd-group-icon">{entry.icon}</span>
                                                <span class="addr-dd-group-label">{entry.label}</span>
                                                <span class="addr-dd-group-count">{entry.count}</span>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div
                                                key={entry.key}
                                                class="addr-dd-item"
                                                data-field={entry.field}
                                                data-email={entry.email}
                                                data-name={entry.name}
                                                data-initials={entry.initials}
                                                data-contact-id={entry.contactId}
                                                data-row-id={entry.id}
                                                data-audience={entry.audience}
                                                data-role={entry.role}
                                                onclick={handleAddrItemClick}
                                            >
                                                <div class={entry.avClass}>{entry.initials}</div>
                                                <div class="addr-dd-info">
                                                    <div class="addr-dd-name">{entry.name}</div>
                                                    <div class="addr-dd-email">{entry.email}</div>
                                                    <div class="addr-dd-subrole">{entry.subrole}</div>
                                                </div>
                                                <div class="addr-dd-right">
                                                    <template lwc:if={entry.status}>
                                                        <span class="addr-dd-status">{entry.status}</span>
                                                    </template>
                                                    <span class={entry.badgeClass}>{entry.badgeLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="addr-row">
                    <div class="addr-key">CC</div>
                    <div class="addr-val">
                        <template for:each={ccChips} for:item="chip">
                            <div key={chip.id} class="r-chip">
                                <div class="r-chip-av">{chip.initials}</div>
                                {chip.name} ({chip.email})
                                <span class="r-chip-x" data-email={chip.email} onclick={handleRemoveCcChip}>×</span>
                            </div>
                        </template>
                        <div class="r-add-wrap" data-field="cc" onclick={stopAddrWrapPropagation}>
                            <div class="r-add" data-field="cc" onclick={handleOpenAddrDropdown}>＋ CC</div>
                            <div class={ccDropdownClass}>
                                <input
                                    class="addr-search"
                                    type="text"
                                    data-field="cc"
                                    placeholder="Name or email…"
                                    value={addrSearchTerm}
                                    oninput={handleAddrSearch}
                                    onkeydown={handleAddrSearchKey}
                                    onclick={stopAddrWrapPropagation}
                                />
                                <div class="addr-dd-list">
                                    <template for:each={ccAddrDropdownEntries} for:item="entry">
                                        <template lwc:if={entry.isEmpty}>
                                            <div key={entry.key} class="addr-dd-empty">No matches found</div>
                                        </template>
                                        <template lwc:elseif={entry.isGroupHeader}>
                                            <div key={entry.key} class={entry.headerClass}>
                                                <span class="addr-dd-group-icon">{entry.icon}</span>
                                                <span class="addr-dd-group-label">{entry.label}</span>
                                                <span class="addr-dd-group-count">{entry.count}</span>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div
                                                key={entry.key}
                                                class="addr-dd-item"
                                                data-field={entry.field}
                                                data-email={entry.email}
                                                data-name={entry.name}
                                                data-initials={entry.initials}
                                                data-contact-id={entry.contactId}
                                                data-row-id={entry.id}
                                                data-audience={entry.audience}
                                                data-role={entry.role}
                                                onclick={handleAddrItemClick}
                                            >
                                                <div class={entry.avClass}>{entry.initials}</div>
                                                <div class="addr-dd-info">
                                                    <div class="addr-dd-name">{entry.name}</div>
                                                    <div class="addr-dd-email">{entry.email}</div>
                                                    <div class="addr-dd-subrole">{entry.subrole}</div>
                                                </div>
                                                <div class="addr-dd-right">
                                                    <template lwc:if={entry.status}>
                                                        <span class="addr-dd-status">{entry.status}</span>
                                                    </template>
                                                    <span class={entry.badgeClass}>{entry.badgeLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="addr-row addr-row-last">
                    <div class="addr-key">BCC</div>
                    <div class="addr-val">
                        <template for:each={bccChips} for:item="chip">
                            <div key={chip.id} class="r-chip">
                                <div class="r-chip-av">{chip.initials}</div>
                                {chip.name} ({chip.email})
                                <span class="r-chip-x" data-email={chip.email} onclick={handleRemoveBccChip}>×</span>
                            </div>
                        </template>
                        <div class="r-add-wrap" data-field="bcc" onclick={stopAddrWrapPropagation}>
                            <div class="r-add" data-field="bcc" onclick={handleOpenAddrDropdown}>＋ BCC</div>
                            <div class={bccDropdownClass}>
                                <input
                                    class="addr-search"
                                    type="text"
                                    data-field="bcc"
                                    placeholder="Name or email…"
                                    value={addrSearchTerm}
                                    oninput={handleAddrSearch}
                                    onkeydown={handleAddrSearchKey}
                                    onclick={stopAddrWrapPropagation}
                                />
                                <div class="addr-dd-list">
                                    <template for:each={bccAddrDropdownEntries} for:item="entry">
                                        <template lwc:if={entry.isEmpty}>
                                            <div key={entry.key} class="addr-dd-empty">No matches found</div>
                                        </template>
                                        <template lwc:elseif={entry.isGroupHeader}>
                                            <div key={entry.key} class={entry.headerClass}>
                                                <span class="addr-dd-group-icon">{entry.icon}</span>
                                                <span class="addr-dd-group-label">{entry.label}</span>
                                                <span class="addr-dd-group-count">{entry.count}</span>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div
                                                key={entry.key}
                                                class="addr-dd-item"
                                                data-field={entry.field}
                                                data-email={entry.email}
                                                data-name={entry.name}
                                                data-initials={entry.initials}
                                                data-contact-id={entry.contactId}
                                                data-row-id={entry.id}
                                                data-audience={entry.audience}
                                                data-role={entry.role}
                                                onclick={handleAddrItemClick}
                                            >
                                                <div class={entry.avClass}>{entry.initials}</div>
                                                <div class="addr-dd-info">
                                                    <div class="addr-dd-name">{entry.name}</div>
                                                    <div class="addr-dd-email">{entry.email}</div>
                                                    <div class="addr-dd-subrole">{entry.subrole}</div>
                                                </div>
                                                <div class="addr-dd-right">
                                                    <template lwc:if={entry.status}>
                                                        <span class="addr-dd-status">{entry.status}</span>
                                                    </template>
                                                    <span class={entry.badgeClass}>{entry.badgeLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="subj-row">
                <input
                    class="subj-input"
                    type="text"
                    value={subject}
                    onfocus={handleSubjectFocus}
                    oninput={handleSubjectChange}
                    onclick={handleSubjectCursor}
                    onkeyup={handleSubjectCursor}
                />
            </div>
            <div class="etbar">
                <button type="button" class="etb" data-action="bold" onmousedown={handleFormatMouseDown} onclick={handleEditorAction}><b>B</b></button>
                <button type="button" class="etb" data-action="italic" onmousedown={handleFormatMouseDown} onclick={handleEditorAction}><i>I</i></button>
                <button type="button" class="etb etb-u" data-action="underline" onmousedown={handleFormatMouseDown} onclick={handleEditorAction}>U</button>
                <div class="etb-sep"></div>
                <button type="button" class="etb etb-sm" data-action="h1" onmousedown={handleFormatMouseDown} onclick={handleEditorAction}>H1</button>
                <button type="button" class="etb etb-sm" data-action="h2" onmousedown={handleFormatMouseDown} onclick={handleEditorAction}>H2</button>
                <div class="etb-sep"></div>
                <button type="button" class="etb etb-ai" onclick={handleOpenAi}>✦ AI Assist</button>
            </div>
            <div
                class="editor-body"
                contenteditable="true"
                lwc:dom="manual"
                data-placeholder="Continue writing, or use ✦ AI Assist to generate from trip data…"
                oninput={handleBodyInput}
                onfocus={handleBodyFocus}
                onclick={handleBodyCursor}
                onkeyup={handleBodyCursor}
                onmouseup={handleBodyCursor}
            ></div>
        </div>

        <div class="tools-panel">
            <div class="tp-section">
                <div class="tp-hdr">
                    <span class="tp-title">Template</span>
                    <span class="tp-act" onclick={handleOpenTemplates}>Browse all →</span>
                </div>
                <template lwc:if={isComposerRecordStep}>
                    <div class="composer-record-step">
                        <div class="composer-record-hdr">
                            <button type="button" class="composer-record-back" onclick={handleComposerCancelRecord}>← Templates</button>
                        </div>
                        <div class="composer-selected-card">
                            <div class="composer-selected-label">Selected template</div>
                            <div class="composer-selected-name">{pendingComposerTemplateName}</div>
                            <div class="composer-selected-meta">Merge against <strong>{pendingComposerRelatedLabel}</strong></div>
                        </div>
                        <template lwc:if={composerHasRelatedRecordOptions}>
                            <div class="composer-record-search">
                                <lightning-input
                                    type="search"
                                    label="Search records"
                                    placeholder="Filter by name…"
                                    value={composerRecordSearch}
                                    onchange={handleComposerRecordSearch}
                                    variant="label-hidden"
                                ></lightning-input>
                            </div>
                            <div class="composer-record-list" role="radiogroup">
                                <template for:each={composerFilteredRecordRows} for:item="row">
                                    <label key={row.recordId} class={row.rowClass}>
                                        <input
                                            type="radio"
                                            name="composerMergeRecord"
                                            value={row.recordId}
                                            checked={row.isSelected}
                                            onchange={handleComposerRecordRadioChange}
                                        />
                                        <span class="composer-record-body">
                                            <span class="composer-record-name">{row.label}</span>
                                            <span class="composer-record-type">{row.objectTypeLabel}</span>
                                        </span>
                                    </label>
                                </template>
                                <template lwc:if={composerHasNoFilteredRecords}>
                                    <div class="composer-record-empty">No records match your search.</div>
                                </template>
                            </div>
                            <button
                                type="button"
                                class="composer-record-load"
                                onclick={handleComposerConfirmRecord}
                                disabled={composerConfirmRecordDisabled}
                            >
                                Load template →
                            </button>
                        </template>
                        <template lwc:else>
                            <div class="composer-record-empty-state">
                                <div class="composer-record-empty-title">No records found</div>
                                <div class="composer-record-empty">{composerRelatedRecordEmptyMessage}</div>
                            </div>
                            <button type="button" class="composer-record-load" disabled>Load template →</button>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <div class="tmpl-search-wrap-outer">
                        <div class="tmpl-search-wrap">
                            <span class="tmpl-search-ic">⌕</span>
                            <input
                                class="tmpl-search-input"
                                type="text"
                                placeholder="Search templates…"
                                value={templateSearch}
                                oninput={handleTemplateSearch}
                            />
                        </div>
                    </div>
                    <template lwc:if={showComposerStageFilters}>
                        <div class="tmpl-stage-filters composer-stage-filters" role="tablist" aria-label="Filter by stage">
                            <template for:each={composerStageFilters} for:item="sf">
                                <button
                                    key={sf.id}
                                    type="button"
                                    role="tab"
                                    class={sf.className}
                                    data-stage={sf.id}
                                    onclick={handleComposerStageFilter}
                                >
                                    {sf.label}
                                </button>
                            </template>
                        </div>
                    </template>
                    <div class="tmpl-scroll-list">
                        <template for:each={filteredTemplates} for:item="tmpl">
                            <div
                                key={tmpl.id}
                                class={tmpl.itemClass}
                                data-id={tmpl.id}
                                onclick={handleTemplateActivate}
                            >
                                <div class="tmpl-item-left">
                                    <div class="tmpl-item-name-row">
                                        <span class="tmpl-item-name">{tmpl.displayName}</span>
                                        <template lwc:if={tmpl.showStagePill}>
                                            <span class={tmpl.stagePillClass}>{tmpl.stagePill}</span>
                                        </template>
                                    </div>
                                </div>
                                <div class="tmpl-item-right">
                                    <template lwc:if={tmpl.isSuggested}>
                                        <span class="tmpl-suggested">✦</span>
                                    </template>
                                    <template lwc:if={tmpl.showRelatedPill}>
                                        <span class={tmpl.relatedBadgeClass}>{tmpl.relatedBadge}</span>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            <div class="tp-section">
                <div class="tp-hdr">
                    <span class="tp-title">Attachments</span>
                    <span class="tp-act att-count">{attCountLabel}</span>
                </div>
                <div class="att-scroll-list">
                    <div class="att-grp">{attachmentSectionLabel}</div>
                    <template for:each={attachments} for:item="att">
                        <div key={att.id} class="att-item">
                            <div class={att.cbClass} data-id={att.id} onclick={handleAttachmentToggle}>✓</div>
                            <div class={att.icClass}>{att.type}</div>
                            <div class="att-t">
                                <div class="att-name">{att.name}</div>
                                <div class="att-meta">{att.meta}</div>
                            </div>
                            <template lwc:if={att.ai}><span class="att-ai">✦ AI suggested</span></template>
                        </div>
                    </template>
                </div>
                <label class="att-upload-zone">
                    <input
                        type="file"
                        class="att-file-input"
                        multiple
                        accept="*/*"
                        onchange={handleFilesSelected}
                    />
                    <div class="att-upload-ic">↑</div>
                    <div class="att-upload-txt">{attachmentUploadHint}</div>
                </label>
            </div>
            <div class="tp-section">
                <div class="tp-hdr"><span class="tp-title">Delivery</span></div>
                <div class="tp-body">
                    <div class="del-row">
                        <div class={deliveryPostmarkClass} onclick={handleDeliveryPostmark}>
                            <div class="del-opt-n">✦ Postmark</div>
                            <div class="del-opt-s">Opens tracked</div>
                        </div>
                        <div class={deliveryNativeClass} onclick={handleDeliveryNative}>
                            <div class="del-opt-n">Native SF</div>
                            <div class="del-opt-s">Sent · Failed</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="send-zone">
                <button type="button" class="send-btn email" onclick={handlePreview}>
                    <span>Preview &amp; Send</span><span class="send-arr">→</span>
                </button>
                <div class="send-sec">
                    <div class="send-sec-btn" onclick={handleSaveDraft}>Save Draft</div>
                    <div class="send-sec-btn" role="button" tabindex="0" onclick={handleDiscard}>Discard</div>
                </div>
            </div>
        </div>

        <c-sugati-communication-ai-assist
            is-open={showAiAssist}
            trip-name={tripName}
            recipient-summary={recipientSummary}
            template-name={activeTemplateName}
            onclose={handleCloseAi}
            onapply={handleAiApply}
        ></c-sugati-communication-ai-assist>

    </div>
</template>
